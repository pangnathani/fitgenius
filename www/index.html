      <div style={{width:36,height:36,borderRadius:9,background:`${c}18`,border:`1px solid ${c}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="Brain" size={16} sw={1.5} style={{color:c}}/></div>
      <div style={{flex:1}}><div style={{fontSize:8,letterSpacing:"0.14em",color:c,fontWeight:900,marginBottom:3}}>AI COACH</div><div style={{fontSize:12,color:"#d4d4d8",lineHeight:1.6}}>{m}{msg.level?" — Welcome, "+msg.level+".":""}</div></div>
      <button onClick={onClose} style={{background:"none",border:"none",color:"#52525b",cursor:"pointer",flexShrink:0,padding:0,display:"flex"}}><Icon name="X" size={14}/></button>
    </div>
  </div>;
}

/* ══ CHAT ASSISTANT ══ */
function ChatAssistant({tone,xp,streak,wCount,mCount,lv}){
  const[open,setOpen]=useState(false);
  const TC={brutal:"#fff",friendly:"#4ade80",hype:"#fbbf24"}[tone]||"#fff";
  const[msgs,setMsgs]=useState([{role:"ai",text:"Hey! I'm your FitGenius AI coach. Ask me anything — workouts, nutrition, form checks, recovery, supplements, whatever you need."}]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[apiOk,setApiOk]=useState(true);
  const fbIdx=useRef(0);
  const endRef=useRef(null);
  const QUICK=["What should I eat today?","Quick 15-min workout?","How to break a plateau?","Am I overtraining?","Best post-workout meal?","Help me build a routine"];

  useEffect(()=>{if(open&&endRef.current)endRef.current.scrollIntoView({behavior:"smooth"});},[msgs,open]);

  const send=async(txt)=>{
    const userMsg=(txt||input).trim();if(!userMsg||loading)return;
    const newMsgs=[...msgs,{role:"user",text:userMsg}];
    setInput("");setMsgs(newMsgs);setLoading(true);
    let gotResponse=false;
    try{
      const contents=[];
      for(let i=0;i<newMsgs.length;i++){
        const m=newMsgs[i];
        const role=m.role==="user"?"user":"model";
        if(contents.length>0&&contents[contents.length-1].role===role){
          contents[contents.length-1].parts[0].text+="\n"+m.text;
        } else {
          contents.push({role,parts:[{text:m.text}]});
        }
      }
      if(contents[0].role==="model") contents.unshift({role:"user",parts:[{text:"Hi coach"}]});
      if(contents[contents.length-1].role!=="user") contents.push({role:"user",parts:[{text:"go on"}]});

      const rankName=lv?.n||"unknown";
      const streakDays=streak?.cur||0;
      const now=new Date();
      const hour=now.getHours();
      const timeOfDay=hour<12?"morning":hour<17?"afternoon":"evening";
      const sysText=`You are FitGenius AI Coach — the world's best personal trainer and nutritionist.

USER PROFILE:
- Rank: ${rankName} (${xp||0} XP)
- Current streak: ${streakDays} days
- Total workouts completed: ${wCount||0}
- Total meals logged: ${mCount||0}
- Time: ${timeOfDay} (${now.toLocaleTimeString()})
- Session: ${Math.random().toString(36).slice(2,7)}

COACHING STYLE: ${tone}
${tone==="brutal"?"Be direct, no-nonsense, military drill sergeant energy. Short sentences. Push them hard.":""}
${tone==="friendly"?"Be warm, encouraging, and supportive. Use emojis occasionally. Celebrate small wins.":""}
${tone==="hype"?"MAXIMUM ENERGY. Use caps sometimes. Hype them up. Be explosive and motivational.":""}

RULES:
1. NEVER repeat a previous response verbatim. Always give fresh advice.
2. Be SPECIFIC: name exercises, rep ranges (3x10), rest periods (90s), food amounts (30g protein).
3. Keep responses under 80 words. Punchy and actionable.
4. Reference the user's stats when relevant ("With ${wCount} sessions under your belt...").
5. If it's ${timeOfDay}, give time-appropriate advice (morning=pre-workout fuel, evening=recovery).
6. For nutrition, use USDA-accurate values. 1 egg = 72 kcal, 6g protein.
7. Be conversational. Remember what they said earlier in this chat.`;

      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          systemInstruction:{parts:[{text:sysText}]},
          contents:contents,
          generationConfig:{maxOutputTokens:200,temperature:1.0,topP:0.95,topK:50}
        })
      });
      if(!res.ok) throw new Error("HTTP "+res.status);
      const d=await res.json();
      const r=d.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      if(r&&r.length>5){
        setApiOk(true);setLoading(false);setMsgs(p=>[...p,{role:"ai",text:r}]);gotResponse=true;
      }
    }catch(e){console.warn("Chat error:",e);setApiOk(false);}
    if(!gotResponse){
      setLoading(false);
      const FB=[
        "Squats are the king of exercises. 3x8-12 with a weight that challenges the last 2 reps. Rest 2 minutes between sets.",
        "Protein timing matters less than total daily intake. Aim for 0.7-1g per pound bodyweight. Chicken breast has 31g per 100g.",
        "Want bigger arms? Superset barbell curls (3x10) with tricep dips (3x12). Arms are 2/3 tricep — don't skip them.",
        "HIIT burns more fat in less time than steady cardio. Try 30s sprint, 60s walk, repeat 8-10 times. Takes 15 minutes.",
        "Creatine monohydrate is the most studied supplement ever. 5g daily, no loading needed. Improves strength by 5-10%.",
        "Deadlifts work 80% of your muscles in one movement. Start with Romanian deadlifts if you're new — lighter, same benefits.",
        "Sleep 7-9 hours. Growth hormone spikes during deep sleep. Poor sleep kills gains faster than bad training.",
        "Overhead press builds boulder shoulders. 4x6-8 heavy, then lateral raises 3x15 light for the side delts.",
        "Greek yogurt has 10g protein per 100g. Add berries and honey post-workout for fast carbs + protein combo.",
        "Progressive overload doesn't always mean more weight. Add reps, slow the tempo, reduce rest time, or add a pause.",
        "Pull-ups are the best back exercise. Can't do one yet? Start with negatives — jump up, lower yourself over 5 seconds.",
        "Hip thrusts beat squats for glute activation. 3x12 with a 2-second pause at the top. Feel the squeeze.",
        "Pre-workout meal: banana + peanut butter 45 min before. Fast carbs for energy, fats for sustained fuel.",
        "Walking 10k steps daily burns ~400-500 extra calories. That's 1 pound of fat per week without changing your diet.",
        "Bench press plateau? Try pause reps: lower the bar, hold 2 seconds on chest, then press. Builds explosive power.",
        "Foam rolling before training improves range of motion without losing strength. Hit quads, hamstrings, and lats.",
        "Face pulls 3x15 every session. Best exercise for posture and shoulder health. Use a rope attachment, pull to forehead.",
        "Caffeine improves workout performance by 3-5%. Take 200mg (one coffee) 30-45 minutes pre-workout for peak effect.",
        "Don't fear carbs. They fuel your workouts. 1-2g per pound bodyweight on training days. Rice, oats, potatoes, fruit.",
        "Mind-muscle connection is real. Slow reps with 2s squeeze at peak contraction build more muscle than fast heavy swings."
      ];
      setMsgs(p=>[...p,{role:"ai",text:FB[fbIdx.current%FB.length]+" [offline]"}]);
      fbIdx.current++;
    }
  };

  return <>
    <button onClick={()=>setOpen(o=>!o)} className="tap coach-icon" style={{position:"fixed",bottom:76,right:14,zIndex:35,width:50,height:50,borderRadius:99,background:TC,border:"none",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 0 24px ${TC}66,0 4px 20px rgba(0,0,0,.7)`}}>
      <Icon name={open?"X":"MessageSquare"} size={21} sw={2.2} style={{color:"#000"}}/>
    </button>
    {open&&<div className="slide-up" style={{position:"fixed",bottom:0,left:0,right:0,zIndex:34,height:"72vh",background:"#09090b",border:"1px solid #27272a",borderRadius:"18px 18px 0 0",display:"flex",flexDirection:"column",maxWidth:600,margin:"0 auto"}}>
      <div style={{padding:"13px 14px 11px",borderBottom:"1px solid #18181b",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <div style={{width:34,height:34,borderRadius:9,background:`${TC}18`,border:`1px solid ${TC}44`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="Brain" size={16} sw={1.5} style={{color:TC}}/></div>
        <div style={{flex:1}}><div style={{fontSize:11,fontWeight:900,color:TC}}>FITGENIUS AI</div><div style={{fontSize:9,color:apiOk?"#4ade80":"#f87171"}}>{apiOk?"● Live · Gemini":"● Offline · Cached tips"}</div></div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>{setMsgs([{role:"ai",text:"Chat cleared! What would you like to know?"}]);fbIdx.current=0;setApiOk(true);}} style={{background:"none",border:"1px solid #27272a",color:"#3f3f46",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,padding:"3px 8px",fontSize:8,fontWeight:700,letterSpacing:"0.06em"}}>CLEAR</button>
          <button onClick={()=>setOpen(false)} style={{background:"none",border:"none",color:"#3f3f46",cursor:"pointer",display:"flex"}}><Icon name="X" size={16}/></button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
        {msgs.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
          <div style={{maxWidth:"84%",padding:"9px 13px",borderRadius:m.role==="user"?"13px 13px 3px 13px":"13px 13px 13px 3px",background:m.role==="user"?TC:"#18181b",color:m.role==="user"?"#000":"#d4d4d8",fontSize:12,lineHeight:1.65,fontWeight:m.role==="user"?700:400}}>{m.text}</div>
        </div>)}
        {loading&&<div style={{display:"flex"}}><div style={{padding:"11px 16px",background:"#18181b",borderRadius:"13px 13px 13px 3px",display:"flex",gap:5}}>{[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:99,background:"#52525b",animation:`pulse 1.2s ease-in-out infinite ${i*.18}s`}}/>)}</div></div>}
        <div ref={endRef}/>
      </div>
      {msgs.length<=1&&!loading&&<div style={{flexShrink:0,padding:"0 12px 8px",display:"flex",gap:6,flexWrap:"wrap"}}>
        {QUICK.map(q=><button key={q} onClick={()=>send(q)} className="tap" style={{padding:"6px 11px",background:"#18181b",border:"1px solid #27272a",borderRadius:99,fontSize:10,color:"#a1a1aa",cursor:"pointer"}}>{q}</button>)}
      </div>}
      <div style={{padding:"10px 12px 14px",borderTop:"1px solid #18181b",display:"flex",gap:8,flexShrink:0}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="Ask about workouts, nutrition, form..." style={{flex:1,background:"#000",border:"1px solid #27272a",borderRadius:10,color:"#fff",fontSize:13,padding:"10px 13px",outline:"none",fontFamily:"inherit"}}/>
        <button onClick={()=>send()} disabled={!input.trim()||loading} className="tap" style={{width:42,height:42,borderRadius:10,background:input.trim()&&!loading?TC:"#27272a",color:input.trim()&&!loading?"#000":"#52525b",border:"none",cursor:input.trim()&&!loading?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><Icon name="ChevronRight" size={18} sw={2.5}/></button>
      </div>
    </div>}
  </>;
}
