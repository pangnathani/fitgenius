function getLvl(xp){
  let idx=0;
  for(let i=LEVELS.length-1;i>=0;i--){if(xp>=LEVELS[i].xp){idx=i;break;}}
  const lv=LEVELS[idx], nx=LEVELS[idx+1]||null;
  const pct=nx?((xp-lv.xp)/(nx.xp-lv.xp))*100:100;
  lv.g=lv.g||`linear-gradient(135deg,#09090b,${lv.c}22)`;
  return{lv,nx,pct:Math.min(pct,100),idx};
}

function todayStr(){return new Date().toISOString().slice(0,10);}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10);}
function fmt(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;}
function compressImg(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      const scale=Math.min(1, 600/Math.max(img.width,img.height));
      c.width=img.width*scale; c.height=img.height*scale;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.7));
    };
    img.src=dataUrl;
  });
}

/* ── SOUND ENGINE (Web Audio API) ── */
function playSound(type){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx();
    const t=ctx.currentTime;
    if(type==="set"){
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type="triangle";
      osc.frequency.setValueAtTime(520,t);
      osc.frequency.exponentialRampToValueAtTime(880,t+0.09);
      g.gain.setValueAtTime(0.12,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
      osc.start(t); osc.stop(t+0.09);
    }else if(type==="complete"){
      [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=>{
        const osc=ctx.createOscillator(), g=ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type="sine";
        osc.frequency.value=f;
        g.gain.setValueAtTime(0.14,t+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.3);
        osc.start(t+i*0.08); osc.stop(t+i*0.08+0.3);
      });
    }else if(type==="level"){
      [440, 554.37, 659.25, 880, 1108.73, 1318.5].forEach((f,i)=>{
        const osc=ctx.createOscillator(), g=ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type="triangle";
        osc.frequency.value=f;
        g.gain.setValueAtTime(0.16,t+i*0.08);
        g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.35);
        osc.start(t+i*0.08); osc.stop(t+i*0.08+0.35);
      });
    }else if(type==="countdown"){
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type="sine";
      osc.frequency.setValueAtTime(800,t);
      g.gain.setValueAtTime(0.12,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      osc.start(t); osc.stop(t+0.08);
    }else if(type==="go"){
      [587.33, 783.99, 1174.66].forEach((f,i)=>{
        const osc=ctx.createOscillator(), g=ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type="triangle";
        osc.frequency.value=f;
        g.gain.setValueAtTime(0.18,t+i*0.07);
        g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.25);
        osc.start(t+i*0.07); osc.stop(t+i*0.07+0.25);
      });
    }
  }catch(e){}
}

function ConfettiBurst({color="#fbbf24"}){
  const pieces=useRef(Array.from({length:36},(_,i)=>({
    id:i,
    left:Math.random()*100,
    delay:Math.random()*0.8,
    size:Math.random()*8+6,
    color:[color,"#fff","#38bdf8","#4ade80","#f43f5e","#fbbf24"][Math.floor(Math.random()*6)],
    duration:Math.random()*1.5+2
  }))).current;

  return <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:9999}}>
    {pieces.map(p=><div key={p.id} className="confetti-piece" style={{
      left:`${p.left}%`,
      width:p.size,
      height:p.size*1.4,
      background:p.color,
      borderRadius:2,
      animationDelay:`${p.delay}s`,
      animationDuration:`${p.duration}s`
    }}/>)}
  </div>;
}

function getFoodMacros(input){
  const l=input.trim().toLowerCase();
  const WORDS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,a:1,an:1,half:0.5};
  let qty=1;
  const nm=l.match(/^(\d+\.?\d*)\s/);
  if(nm) qty=parseFloat(nm[1]);
  else{const wm=l.match(/^(one|two|three|four|five|six|seven|eight|nine|ten|a|an|half)\s/);if(wm) qty=WORDS[wm[1]]||1;}
  for(const f of FOOD_DB){
    if(f.k.some(k=>l.includes(k))){
      return{kcal:Math.round(f.kcal*qty),p:Math.round(f.p*qty*10)/10,c:Math.round(f.c*qty*10)/10,fat:Math.round(f.f*qty*10)/10,food:f.k[0],qty,unit:f.unit,serving:f.sv};
    }
  }
  return{kcal:Math.round(300*qty),p:Math.round(15*qty),c:Math.round(35*qty),fat:Math.round(10*qty),food:input.trim(),qty,unit:"serving",serving:"estimated"};
}

function isBadgeUnlocked(b,path,xp,wCount,mCount,streak,flags){
  if(path==="xp") return xp>=b.req;
  if(path==="streak") return streak>=b.req;
  if(path==="warrior") return wCount>=b.req;
  if(path==="nutrition") return mCount>=b.req;
  if(path==="special") return !!flags[b.req];
  return false;
}
function badgePct(b,path,xp,wCount,mCount,streak,flags){
  if(path==="xp") return Math.min((xp/b.req)*100,100);
  if(path==="streak") return Math.min((streak/b.req)*100,100);
  if(path==="warrior") return Math.min((wCount/b.req)*100,100);
  if(path==="nutrition") return Math.min((mCount/b.req)*100,100);
  if(path==="special") return flags[b.req]?100:0;
  return 0;
}

function getFormTips(name){
  const n=(name||"").toLowerCase();
  if(n.includes("squat")||n.includes("goblet")) return FORM_TIPS.squat;
  if(n.includes("bench")||n.includes("chest press")) return FORM_TIPS.bench;
  if(n.includes("deadlift")||n.includes("rdl")) return FORM_TIPS.deadlift;
  if(n.includes("pull-up")||n.includes("pullup")||n.includes("pulldown")||n.includes("chin")) return FORM_TIPS.pullup;
  if(n.includes("curl")) return FORM_TIPS.curl;
  if(n.includes("push-up")||n.includes("pushup")) return FORM_TIPS.pushup;
  if(n.includes("row")||n.includes("shrug")) return FORM_TIPS.row;
  if(n.includes("press")&&!n.includes("bench")&&!n.includes("chest")) return FORM_TIPS.press;
  if(n.includes("lunge")||n.includes("split squat")) return FORM_TIPS.lunge;
  if(n.includes("plank")||n.includes("crunch")||n.includes("leg raise")) return FORM_TIPS.plank;
  return FORM_TIPS.generic;
}

function Icon({name,size=24,sw=1.5,style={},className=""}){
  const d=ICON_PATHS[name];
  if(!d) return null;
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style} className={className}><path d={d}/></svg>;
}

/* ── CHARTS ── */
function BarChart({data,color,labels,h=70}){
  const mx=Math.max(...data,1);
  const w=data.length;
  return <svg viewBox={`0 0 ${w*14} ${h+18}`} style={{width:"100%",height:h+18}}>
    {data.map((v,i)=>{
      const bh=Math.max((v/mx)*(h-4),v>0?3:0);
      return <g key={i}>
        <rect x={i*14+2} y={h-bh} width={10} height={bh} rx={3} fill={v>0?color:"#1a1a1a"} opacity={v>0?.85:.3}/>
        {labels&&labels[i]&&<text x={i*14+7} y={h+13} textAnchor="middle" fontSize="7" fill="#3f3f46" fontWeight="700">{labels[i]}</text>}
        {v>0&&<text x={i*14+7} y={h-bh-3} textAnchor="middle" fontSize="7" fill={color} fontWeight="700">{v}</text>}
      </g>;
    })}
  </svg>;
}

/* ══ MAIN APP ══ */
function App(){
  const[tab,setTab]=useState("train");
  const[xp,setXp]=useState(()=>loadJSON("fg_xp",0));
  const[wHistory,setWH]=useState(()=>loadJSON("fg_wh",[]));
  const[mHistory,setMH]=useState(()=>loadJSON("fg_mh",[]));
  const[chalData,setChalData]=useState(()=>loadJSON("fg_ch",{}));
  const[flags,setFlags]=useState(()=>loadJSON("fg_flags",{}));
  const[xpLog,setXpLog]=useState(()=>loadJSON("fg_xplog",[]));
  const[settings,setSettings]=useState(()=>loadJSON("fg_set",{tone:"brutal",units:"lbs",notifications:true,name:""}));
  const[macroGoals,setMacroGoals]=useState(()=>loadJSON("fg_macro_goals",{kcal:2200,protein:150,carbs:220,fat:65,goal:"maintain"}));
  const[streak,setStreak]=useState(()=>loadJSON("fg_streak",{cur:0,best:0,lastDate:null}));
  const[isPro,setIsPro]=useState(()=>loadJSON("fg_pro",false));
  const[workout,setWorkout]=useState([]);
  const[showKin,setShowKin]=useState(null);
  const[showEdit,setShowEdit]=useState(null);
  const[showAddEx,setShowAddEx]=useState(false);
  const[showOverlay,setShowOverlay]=useState(false);
  const[showPaywall,setShowPaywall]=useState(false);
  const[badgeView,setBadgeView]=useState(null);
  const[coachMsg,setCoachMsg]=useState(null);
  const[toast,setToast]=useState(null);
  const[levelUpData,setLevelUpData]=useState(null);
  const[onboarded,setOnboarded]=useState(()=>!!localStorage.getItem("fg_onb"));

  const tone=settings.tone||"brutal";

  /* persist */
  useEffect(()=>{saveJSON("fg_xp",xp);},[xp]);
  useEffect(()=>{saveJSON("fg_wh",wHistory);},[wHistory]);
  useEffect(()=>{saveJSON("fg_mh",mHistory);},[mHistory]);
  useEffect(()=>{saveJSON("fg_ch",chalData);},[chalData]);
  useEffect(()=>{saveJSON("fg_flags",flags);},[flags]);
  useEffect(()=>{saveJSON("fg_xplog",xpLog);},[xpLog]);
  useEffect(()=>{saveJSON("fg_set",settings);},[settings]);
  useEffect(()=>{saveJSON("fg_streak",streak);},[streak]);
  useEffect(()=>{saveJSON("fg_macro_goals",macroGoals);},[macroGoals]);
  useEffect(()=>{saveJSON("fg_pro",isPro);},[isPro]);

  /* streak */
  useEffect(()=>{
    const today=todayStr(), yest=daysAgo(1);
    if(streak.lastDate===today) return;
    if(streak.lastDate===yest) setStreak(s=>({cur:s.cur+1,best:Math.max(s.best,s.cur+1),lastDate:today}));
    else if(streak.lastDate!==today) setStreak(s=>({cur:1,best:Math.max(s.best,1),lastDate:today}));
  },[]);

  const showToast=(msg)=>{setToast(msg);setTimeout(()=>setToast(null),2800);};

  const addXP=(amt,reason,showCoach=false)=>{
    const prev=getLvl(xp), next=getLvl(xp+amt);
    setXp(x=>x+amt);
    setXpLog(l=>[...l,{date:todayStr(),amt,reason}]);
    showToast(`+${amt} XP — ${reason}`);
    if(next.idx>prev.idx){
      playSound("level");
      setLevelUpData({oldLv:prev.lv,newLv:next.lv,rankIdx:next.idx+1});
    } else if(showCoach){
      setTimeout(()=>setCoachMsg({type:"workout"}),600);
    }
  };

  const setFlag=f=>setFlags(p=>({...p,[f]:true}));
  const recordWorkout=w=>{setWH(h=>[{...w,date:todayStr(),id:Date.now()},...h]);setFlag(new Date().getHours()>=22?"nightOwl":new Date().getHours()<6?"earlyBird":"session");};
  const recordMeal=m=>setMH(h=>[m,...h]);
  const deleteMeal=id=>setMH(h=>h.filter(m=>m.id!==id));
  const onBadge=(b,pid)=>setBadgeView({b,pid});

  const wCount=wHistory.length, mCount=mHistory.length;
  const TABS=[
    {id:"train",icon:"Dumbbell",label:"TRAIN"},
    {id:"food",icon:"Utensils",label:"FOOD"},
    {id:"rank",icon:"Trophy",label:"RANK"},
    {id:"data",icon:"BarChart",label:"DATA"},
    {id:"coach",icon:"Brain",label:"COACH"},
    {id:"settings",icon:"Settings",label:"MORE"},
  ];
  const{lv}=getLvl(xp);

  if(!onboarded) return <OnboardModal onDone={()=>{setOnboarded(true);localStorage.setItem("fg_onb","1");}}/>;

  return <div style={{height:"100%",display:"flex",flexDirection:"column",maxWidth:480,margin:"0 auto",position:"relative"}}>
    {/* Header */}
    <div style={{flexShrink:0,padding:"12px 14px 10px",borderBottom:"1px solid #18181b",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div>
        <div style={{fontSize:14,fontWeight:900,letterSpacing:"0.06em"}}>FITGENIUS<span style={{color:lv.c}}>.AI</span></div>
        <div style={{fontSize:9,color:"#52525b",fontWeight:600,letterSpacing:"0.08em",marginTop:1}}>{lv.n} · {xp.toLocaleString()} XP · {streak.cur}d 🔥</div>
      </div>
      <LvlBadge xp={xp}/>
    </div>

    {/* Content */}
    <div style={{flex:1,overflowY:"auto",overflowX:"hidden",WebkitOverflowScrolling:"touch",scrollBehavior:"smooth"}}>
      {tab==="train"&&<TrainTab tone={tone} addXP={addXP} workout={workout} setWorkout={setWorkout} setShowKin={setShowKin} setShowEdit={setShowEdit} setShowAddEx={setShowAddEx} showOverlay={showOverlay} setShowOverlay={setShowOverlay} recordWorkout={recordWorkout} setFlag={setFlag} streak={streak} xp={xp} lv={lv}/>}
      {tab==="food"&&<FoodTab tone={tone} addXP={addXP} mHistory={mHistory} recordMeal={recordMeal} deleteMeal={deleteMeal} setShowPaywall={setShowPaywall} macroGoals={macroGoals} setMacroGoals={setMacroGoals} units={settings.units||"lbs"}/>}
      {tab==="rank"&&<RankTab xp={xp} tone={tone} wCount={wCount} mCount={mCount} streak={streak.cur} flags={flags} chalData={chalData} setChalData={setChalData} addXP={addXP} setFlag={setFlag} onBadge={onBadge}/>}
      {tab==="data"&&<DataTab xp={xp} wHistory={wHistory} mHistory={mHistory} xpLog={xpLog} streak={streak} setShowPaywall={setShowPaywall}/>}
      {tab==="coach"&&<CoachTab tone={tone} settings={settings} setSettings={setSettings} setShowPaywall={setShowPaywall} setFlag={setFlag} isPro={isPro}/>}
      {tab==="settings"&&<SettingsTab settings={settings} setSettings={setSettings} xp={xp} streak={streak} wCount={wCount} setShowPaywall={setShowPaywall} tone={tone} isPro={isPro}/>}
    </div>

    {/* Bottom Nav */}
    <div style={{flexShrink:0,borderTop:"1px solid #18181b",background:"#000",display:"flex",padding:"6px 4px",paddingBottom:"max(6px,env(safe-area-inset-bottom))"}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className="tap" style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"5px 0",background:"none",border:"none",cursor:"pointer",color:tab===t.id?"#fff":"#3f3f46",transition:"color .15s"}}>
        <Icon name={t.icon} size={18} sw={tab===t.id?2:1.3}/>
        <span style={{fontSize:8,fontWeight:tab===t.id?900:600,letterSpacing:"0.1em"}}>{t.label}</span>
      </button>)}
    </div>

    {/* Modals */}
    {showKin&&<KinModal ex={showKin} onClose={()=>setShowKin(null)}/>}
    {showEdit&&<EditModal ex={showEdit} onSave={updated=>{setWorkout(p=>p.map(e=>e.id===updated.id?updated:e));setShowEdit(null);}} onClose={()=>setShowEdit(null)}/>}
    {showAddEx&&<AddExModal onAdd={ex=>{setWorkout(p=>[...p,{...ex,id:`ex-${Date.now()}`}]);setShowAddEx(false);}} onClose={()=>setShowAddEx(false)}/>}
    {showPaywall&&<PaywallModal tone={tone} isPro={isPro} onSuccess={()=>{setIsPro(true);saveJSON("fg_pro",true);}} onClose={()=>setShowPaywall(false)}/>}
    {badgeView&&<BadgeModal b={badgeView.b} pid={badgeView.pid} xp={xp} wCount={wCount} mCount={mCount} streak={streak.cur} flags={flags} onClose={()=>setBadgeView(null)}/>}
    {levelUpData&&<LevelUpModal data={levelUpData} onClose={()=>setLevelUpData(null)}/>}
    {toast&&<div style={{position:"fixed",top:50,left:"50%",transform:"translateX(-50%)",zIndex:99,background:"#18181b",border:"1px solid #27272a",borderRadius:10,padding:"8px 18px",fontSize:11,fontWeight:700,color:"#d4d4d8",animation:"toast 2.8s ease forwards",whiteSpace:"nowrap",pointerEvents:"none"}}>{toast}</div>}
    {coachMsg&&<CoachPopup msg={coachMsg} tone={tone} onClose={()=>setCoachMsg(null)}/>}
    <ChatAssistant tone={tone} xp={xp} streak={streak} wCount={wCount} mCount={mCount} lv={lv}/>
  </div>;
}

function LvlBadge({xp}){
  const{lv,pct,idx}=getLvl(xp);
  const R=15,C=2*Math.PI*R;
  return <div style={{position:"relative",width:38,height:38}}>
    <svg width="38" height="38" style={{transform:"rotate(-90deg)"}}>
      <circle cx="19" cy="19" r={R} fill="none" stroke="#27272a" strokeWidth="3"/>
      <circle cx="19" cy="19" r={R} fill="none" stroke={lv.c} strokeWidth="3" strokeDasharray={C} strokeDashoffset={C-(pct/100)*C} strokeLinecap="round" style={{filter:`drop-shadow(0 0 4px ${lv.c})`}}/>
    </svg>
    <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:lv.c}}>{idx+1}</div>
  </div>;
}

/* ── DAILY COACH BANNER ── */
function DailyCoachBanner({tone,streak,xp,lv}){
  const[quote,setQuote]=useState(null);
  const[loadingQuote,setLoadingQuote]=useState(false);

  const COACH_DATA={
    brutal:{name:"SERGEANT IRON",color:"#f87171",icon:"Sword",tag:"ZERO EXCUSES",defaultQuote:"Pain is weakness leaving the body. Put the work in today."},
    friendly:{name:"DR. WELLNESS",color:"#4ade80",icon:"Sun",tag:"SCIENCE & FORM",defaultQuote:"Consistency beats intensity every time. Listen to your body and make progress."},
    hype:{name:"HYPE LORD",color:"#fbbf24",icon:"Zap",tag:"MAX ENERGY",defaultQuote:"YOU ARE BUILT DIFFERENT! Today is your day to break personal records!"},
    zen:{name:"MASTER ZEN",color:"#38bdf8",icon:"Wind",tag:"MIND & FOCUS",defaultQuote:"Breathe deeply. Flow with resistance. Mastery is patience in motion."},
    science:{name:"DATA COACH",color:"#a78bfa",icon:"Cpu",tag:"OPTIMIZED",defaultQuote:"Stimulate, do not annihilate. Progressive overload calculated for maximum hypertrophy."}
  };
  const c=COACH_DATA[tone]||COACH_DATA.brutal;

  const fetchAiBriefing=async()=>{
    if(loadingQuote)return;
    setLoadingQuote(true);
    try{
      const now=new Date();
      const prompt=`You are ${c.name}, a fitness coach with personality tone '${tone}'.
User rank: ${lv?.n||"Athlete"} (${xp||0} XP), streak: ${streak?.cur||0} days.
Time: ${now.toLocaleTimeString()}.
Provide a single 1-sentence powerful motivation or workout focus cue for today. Under 25 words.`;
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:80,temperature:0.9}})
      });
      const d=await res.json();
      const txt=d.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
      if(txt&&txt.length>4){setQuote(txt.replace(/^"|"$/g,''));setLoadingQuote(false);return;}
    }catch(e){}
    setLoadingQuote(false);
    setQuote(c.defaultQuote);
  };

  const todayDate=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}).toUpperCase();

  return <div className="card fade-up" style={{padding:12,border:`1px solid ${c.color}33`,background:`${c.color}08`}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>

        <div style={{width:28,height:28,borderRadius:7,background:`${c.color}22`,border:`1px solid ${c.color}55`,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <Icon name={c.icon} size={14} sw={2} style={{color:c.color}}/>
        </div>
        <div>
          <div style={{fontSize:8,letterSpacing:"0.14em",color:c.color,fontWeight:900}}>{c.name} · {c.tag}</div>
          <div style={{fontSize:8,color:"#52525b",fontWeight:700}}>{todayDate} · {streak?.cur||0}D STREAK 🔥</div>
        </div>
      </div>
      <button onClick={fetchAiBriefing} disabled={loadingQuote} className="tap" style={{padding:"4px 8px",background:`${c.color}15`,border:`1px solid ${c.color}44`,borderRadius:6,color:c.color,fontSize:8,fontWeight:900,cursor:loadingQuote?"default":"pointer",display:"flex",alignItems:"center",gap:4}}>
        <Icon name="Sparkles" size={10} sw={2}/>{loadingQuote?"THINKING...":"AI BRIEFING"}
      </button>
    </div>
    <div style={{fontSize:11,color:"#e4e4e7",lineHeight:1.5,fontStyle:"italic"}}>
      "{quote||c.defaultQuote}"
    </div>
  </div>;
}

/* ══ TRAIN TAB ══ */
function TrainTab({tone,addXP,workout,setWorkout,setShowKin,setShowEdit,setShowAddEx,showOverlay,setShowOverlay,recordWorkout,setFlag,streak,xp,lv}){
  const[mode,setMode]=useState("params");
  const[muscles,setMuscles]=useState([]);
  const[intensity,setIntensity]=useState("Intermediate");
  const[duration,setDuration]=useState("45 min");
  const[aiPrompt,setAiPrompt]=useState("");
  const[loading,setLoading]=useState(false);
  const INP={background:"#09090b",border:"1px solid #27272a",borderRadius:10,color:"#fff",fontSize:13,padding:"10px 12px",outline:"none",fontFamily:"inherit",width:"100%"};
  const togMuscle=m=>setMuscles(p=>p.includes(m)?p.filter(x=>x!==m):[...p,m]);

  const QUICK_PROMPTS=[
    "🔥 20m Dumbbell Full Body",
    "⚡ Heavy Chest & Triceps",
    "🍑 Glutes & Core (No Weights)",
    "🦵 Leg Day Hypertrophy",
    "🏃‍♂️ 15m Fast HIIT Fat Burn"
  ];

  const gen=async()=>{
    setLoading(true);
    if(mode==="ai"&&aiPrompt.trim()){
      try{
        const promptText=`You are an elite strength & conditioning coach.
User workout request: "${aiPrompt}".
Target intensity: ${intensity}. Target duration: ${duration}.
Create a scientifically optimal workout with 4-6 exercises.
Reply ONLY with a raw JSON array matching this format, no markdown:
[{"n":"Exercise Name","s":3,"r":10,"mu":["Chest","Triceps"]}]`;

        const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({contents:[{role:"user",parts:[{text:promptText}]}],generationConfig:{maxOutputTokens:350,temperature:0.2}})
        });
        const d=await res.json();
        const raw=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
        const m=raw.match(/\[[\s\S]*\]/);
        if(m){
          const parsed=JSON.parse(m[0]);
          if(Array.isArray(parsed)&&parsed.length>0){
            setWorkout(parsed.map((e,i)=>({
              n:e.n||e.name||"Exercise",
              name:e.n||e.name||"Exercise",
              s:e.s||e.sets||3,
              sets:e.s||e.sets||3,
              r:e.r||e.reps||10,
              reps:e.r||e.reps||10,
              mu:e.mu||e.muscles||["Full Body"],
              muscles:e.mu||e.muscles||["Full Body"],
              id:`ai-ex-${Date.now()}-${i}`
            })));
            setLoading(false);
            return;
          }
        }
      }catch(e){console.warn("AI workout generation error:",e);}
    }

    setTimeout(()=>{
      let exs=[];
      const grps=muscles.length?muscles:["CHEST"];
      grps.forEach(g=>{const pr=WP[g]||[];exs.push(...pr.slice(0,Math.ceil(6/grps.length)));});
      setWorkout(exs.slice(0,6).map((e,i)=>({...e,id:`ex-${Date.now()}-${i}`})));
      setLoading(false);
    },800);
  };

  return <div style={{padding:14,paddingBottom:24,display:"flex",flexDirection:"column",gap:12}}>
    {/* Daily AI Coach Motivation */}
    <DailyCoachBanner tone={tone} streak={streak} xp={xp} lv={lv}/>

    {/* Mode Selector */}
    <div style={{display:"flex",background:"#09090b",border:"1px solid #27272a",borderRadius:10,overflow:"hidden",padding:3,gap:3}}>
      {[["params","PARAMETERS"],["ai","AI PROMPT ⚡"]].map(([m,l])=><button key={m} onClick={()=>setMode(m)} className="tap" style={{flex:1,padding:"8px 0",fontSize:9,letterSpacing:"0.1em",fontWeight:900,border:"none",cursor:"pointer",background:mode===m?"#fff":"transparent",color:mode===m?"#000":"#52525b",borderRadius:7}}>{l}</button>)}
    </div>

    {mode==="params"?<div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{fontSize:9,letterSpacing:"0.18em",color:"#52525b",fontWeight:700}}>TARGET MUSCLES</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
        {MUSCLE_GROUPS.slice(0,12).map(m=><button key={m} onClick={()=>togMuscle(m)} className="tap" style={{padding:"8px 4px",fontSize:8,letterSpacing:"0.06em",fontWeight:900,border:muscles.includes(m)?"1px solid #fff":"1px solid #27272a",background:muscles.includes(m)?"#fff":"#09090b",color:muscles.includes(m)?"#000":"#52525b",borderRadius:7,cursor:"pointer",transition:"all .15s"}}>{m}</button>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {[["INTENSITY",intensity,setIntensity,["Beginner","Intermediate","Advanced"]],["DURATION",duration,setDuration,["15 min","30 min","45 min","60 min","90 min"]]].map(([l,v,sv,opts])=><div key={l}>
          <div style={{fontSize:8,letterSpacing:"0.18em",color:"#52525b",fontWeight:700,marginBottom:5}}>{l}</div>
          <select value={v} onChange={e=>sv(e.target.value)} style={{...INP,WebkitAppearance:"none"}}>{opts.map(o=><option key={o}>{o}</option>)}</select>
        </div>)}
      </div>
    </div>:<div className="fade-up" style={{display:"flex",flexDirection:"column",gap:8}}>
      <div style={{fontSize:8,letterSpacing:"0.18em",color:"#52525b",fontWeight:700}}>AI DIRECTIVE (POWERED BY GEMINI)</div>
      <textarea value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} placeholder="e.g. 30 min dumbbell upper body pump, focus on shoulders and arms, bad lower back..." style={{...INP,resize:"none",height:85,lineHeight:1.5}}/>
      <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:4}}>
        {QUICK_PROMPTS.map(p=><button key={p} onClick={()=>setAiPrompt(p.replace(/^[^\w]+/, ''))} className="tap" style={{flexShrink:0,padding:"4px 8px",fontSize:8,fontWeight:700,color:"#a1a1aa",background:"#09090b",border:"1px solid #27272a",borderRadius:99,cursor:"pointer"}}>{p}</button>)}
      </div>
    </div>}

    <button onClick={gen} disabled={loading} className="tap" style={{width:"100%",padding:"13px 0",fontSize:10,letterSpacing:"0.14em",fontWeight:900,background:loading?"#18181b":"#fff",color:loading?"#52525b":"#000",border:"none",borderRadius:10,cursor:loading?"default":"pointer"}}>
      {loading?<span className="shimmer">AI ARCHITECTING PROTOCOL...</span>:mode==="ai"?"GENERATE WITH AI ⚡":"GENERATE PROTOCOL"}
    </button>

    {workout.length>0&&!loading&&<div className="fade-up" style={{display:"flex",flexDirection:"column",gap:8}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{fontSize:9,letterSpacing:"0.18em",color:"#52525b",fontWeight:700}}>PROTOCOL — {workout.length} EXERCISES</div>

/* ── WORKOUT OVERLAY ── */
function WorkoutOverlay({workout,tone,onClose,onDone}){
  const[time,setTime]=useState(0);
  const[paused,setPaused]=useState(false);
  const[done,setDone]=useState({});
  const[showWarn,setShowWarn]=useState(false);
  const[restTime,setRestTime]=useState(0);
  const[restMax,setRestMax]=useState(90);
  const[floatingXp,setFloatingXp]=useState(null);
  const[justRecovered,setJustRecovered]=useState(false);
  const timer=useRef(null);
  const restRef=useRef(null);
  useEffect(()=>{if(!paused)timer.current=setInterval(()=>setTime(t=>t+1),1000);else clearInterval(timer.current);return()=>clearInterval(timer.current);},[paused]);
  useEffect(()=>{
    if(restTime>0){
      restRef.current=setInterval(()=>{
        setRestTime(t=>{
          if(t<=1){
            clearInterval(restRef.current);
            playSound("go");
            setJustRecovered(true);
            setTimeout(()=>setJustRecovered(false),3000);
            return 0;
          }
          if(t<=4 && t>=2){
            playSound("countdown");
          }
          return t-1;
        });
      },1000);
    }
    return()=>clearInterval(restRef.current);
  },[restTime>0]);

  const togSet=(eid,i)=>{
    setDone(p=>{
      const s=new Set(p[eid]||[]);
      if(s.has(i)){
        s.delete(i);
      }else{
        s.add(i);
        setRestTime(restMax);
        playSound("set");
        setFloatingXp({eid,i,id:Date.now()});
        setTimeout(()=>setFloatingXp(null),850);
      }
      return{...p,[eid]:s};
    });
  };

  const total=workout.reduce((a,e)=>a+(e.s||e.sets),0);
  const compl=Object.values(done).reduce((a,s)=>a+s.size,0);
  const tryFinish=()=>{if(compl<total)setShowWarn(true);else onDone(compl,time);};
  const rPct=restMax>0?(restTime/restMax)*100:0;

  return <div style={{position:"fixed",inset:0,zIndex:50,background:"#000",display:"flex",flexDirection:"column"}}>
    <div style={{height:3,background:"#18181b"}}><div style={{height:"100%",background:"#fff",width:`${total?(compl/total)*100:0}%`,transition:"width .3s"}}/></div>
    <div style={{flexShrink:0,padding:"16px 16px 12px",textAlign:"center",borderBottom:"1px solid #18181b"}}>
      <div style={{fontSize:9,letterSpacing:"0.2em",color:"#3f3f46",fontWeight:700,marginBottom:4}}>WORKOUT IN PROGRESS</div>
      <div style={{fontSize:54,fontWeight:900,letterSpacing:"-0.04em",fontVariantNumeric:"tabular-nums"}}>{fmt(time)}</div>
      <div style={{fontSize:10,color:"#52525b",marginTop:2}}>{compl}/{total} SETS COMPLETE</div>

      {restTime>0&&<div style={{marginTop:10}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,marginBottom:4}}>
          <div style={{fontSize:28,fontWeight:900,color:"#4ade80",fontVariantNumeric:"tabular-nums"}}>{fmt(restTime)}</div>
          <div style={{fontSize:8,color:"#4ade80",fontWeight:700,letterSpacing:"0.14em"}}>REST</div>
        </div>
        <div style={{height:4,background:"#18181b",borderRadius:99,overflow:"hidden",maxWidth:200,margin:"0 auto 8px"}}>
          <div style={{height:"100%",background:"#4ade80",width:`${rPct}%`,transition:"width 1s linear",borderRadius:99}}/>
        </div>
        {/* Quick rest adjusters */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <button onClick={()=>setRestTime(t=>Math.max(0,t-15))} className="tap" style={{padding:"3px 8px",fontSize:8,fontWeight:900,background:"#18181b",border:"1px solid #27272a",color:"#71717a",borderRadius:5,cursor:"pointer"}}>-15s</button>
          <button onClick={()=>setRestTime(t=>t+15)} className="tap" style={{padding:"3px 8px",fontSize:8,fontWeight:900,background:"#18181b",border:"1px solid #27272a",color:"#71717a",borderRadius:5,cursor:"pointer"}}>+15s</button>
          <button onClick={()=>{setRestTime(0);playSound("go");setJustRecovered(true);setTimeout(()=>setJustRecovered(false),2500);}} className="tap" style={{padding:"3px 9px",fontSize:8,fontWeight:900,background:"rgba(74,222,128,.15)",border:"1px solid rgba(74,222,128,.4)",color:"#4ade80",borderRadius:5,cursor:"pointer"}}>SKIP REST ⚡</button>
        </div>
      </div>}

      {justRecovered&&<div className="badge-pop" style={{marginTop:8,display:"inline-block",padding:"5px 12px",background:"rgba(74,222,128,.15)",border:"1px solid #4ade80",borderRadius:8,color:"#4ade80",fontSize:9,fontWeight:900,letterSpacing:"0.12em"}}>
        ⚡ REST OVER! HIT YOUR NEXT SET!
      </div>}
    </div>

    {/* Rest timer config */}
    <div style={{flexShrink:0,padding:"8px 14px",borderBottom:"1px solid #18181b",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
      <span style={{fontSize:8,color:"#3f3f46",fontWeight:700,letterSpacing:"0.1em"}}>AUTO REST:</span>
      {[60,90,120,180].map(s=><button key={s} onClick={()=>setRestMax(s)} className="tap" style={{padding:"4px 10px",fontSize:9,fontWeight:900,border:restMax===s?"1px solid #4ade80":"1px solid #27272a",background:restMax===s?"rgba(74,222,128,.1)":"transparent",color:restMax===s?"#4ade80":"#52525b",borderRadius:6,cursor:"pointer"}}>{s}s</button>)}
    </div>

    <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10}}>
      {workout.map(ex=>{const ds=done[ex.id]||new Set();const sets=ex.s||ex.sets;const all=ds.size===sets;return(
        <div key={ex.id} className="card" style={{padding:12,opacity:all?.55:1,transition:"opacity .3s"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:900}}>{(ex.n||ex.name).toUpperCase()}</div>
            {all&&<span style={{fontSize:9,color:"#4ade80",fontWeight:900}}>✓ DONE</span>}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {Array.from({length:sets}).map((_,i)=><div key={i} style={{position:"relative"}}>
              <button onClick={()=>togSet(ex.id,i)} className="tap" style={{width:40,height:40,border:ds.has(i)?"1px solid #fff":"1px solid #3f3f46",background:ds.has(i)?"#fff":"transparent",color:ds.has(i)?"#000":"#52525b",fontSize:12,fontWeight:900,cursor:"pointer",borderRadius:7,transition:"all .15s"}}>{ds.has(i)?"✓":i+1}</button>
              {floatingXp&&floatingXp.eid===ex.id&&floatingXp.i===i&&<div className="float-xp" style={{top:-6,left:"50%"}}>+8 XP</div>}
            </div>)}
          </div>
        </div>
      );})}
    </div>
    <div style={{flexShrink:0,borderTop:"1px solid #18181b",padding:14,display:"flex",gap:8}}>
      <button onClick={()=>setPaused(p=>!p)} className="tap" style={{flex:1,padding:13,border:"1px solid #27272a",background:"none",color:"#fff",fontSize:9,letterSpacing:"0.14em",fontWeight:900,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6,borderRadius:9}}><Icon name={paused?"Play":"Pause"} size={13} sw={2}/>{paused?"RESUME":"PAUSE"}</button>
      <button onClick={tryFinish} className="tap" style={{flex:1,padding:13,background:"#fff",color:"#000",border:"none",fontSize:9,letterSpacing:"0.14em",fontWeight:900,cursor:"pointer",borderRadius:9}}>FINISH</button>
    </div>
    {showWarn&&<div style={{position:"fixed",inset:0,zIndex:60,background:"rgba(0,0,0,.88)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowWarn(false)}>
      <div onClick={e=>e.stopPropagation()} className="slide-up card" style={{width:"100%",maxWidth:310,padding:22,textAlign:"center"}}>
        <div style={{fontSize:32,marginBottom:8}}>⚠️</div>
        <div style={{fontSize:13,fontWeight:900,letterSpacing:"0.08em",marginBottom:7}}>NOT ALL SETS DONE</div>
        <div style={{fontSize:11,color:"#71717a",marginBottom:18,lineHeight:1.6}}>{total-compl} {total-compl===1?"set":"sets"} remaining. Finishing early still counts!</div>
        <div style={{display:"flex",gap:9}}>
          <button onClick={()=>setShowWarn(false)} className="tap" style={{flex:1,padding:12,border:"1px solid #27272a",background:"none",color:"#fff",fontSize:9,letterSpacing:"0.1em",fontWeight:900,cursor:"pointer",borderRadius:9}}>KEEP GOING</button>
          <button onClick={()=>onDone(compl,time)} className="tap" style={{flex:1,padding:12,background:"#f87171",color:"#000",border:"none",fontSize:9,letterSpacing:"0.1em",fontWeight:900,cursor:"pointer",borderRadius:9}}>FINISH ANYWAY</button>
        </div>
      </div>
    </div>}
  </div>;
}

/* ── MACRO CALCULATOR MODAL (Mifflin-St Jeor TDEE) ── */
function MacroCalculatorModal({units,currentGoals,onSave,onClose}){
  const[weight,setWeight]=useState(units==="kg"?75:165);
  const[height,setHeight]=useState(units==="kg"?175:70);
  const[age,setAge]=useState(25);
  const[gender,setGender]=useState("male");
  const[activity,setActivity]=useState(1.55);
  const[goal,setGoal]=useState(currentGoals?.goal||"maintain");

  const I={width:"100%",background:"#000",border:"1px solid #27272a",borderRadius:8,color:"#fff",fontSize:13,padding:"9px 10px",outline:"none",fontFamily:"inherit"};

  const calculate=()=>{
    const wKg=units==="kg"?weight:weight*0.453592;
    const hCm=units==="kg"?height:height*2.54;
    const bmr=gender==="male"?(10*wKg+6.25*hCm-5*age+5):(10*wKg+6.25*hCm-5*age-161);
    const tdee=bmr*activity;

    let targetKcal=Math.round(tdee);
    let targetProtein=Math.round((units==="kg"?wKg*2.2:weight)*0.9);

    if(goal==="cut"){
      targetKcal=Math.round(tdee-500);
      targetProtein=Math.round((units==="kg"?wKg*2.2:weight)*1.0);
    }else if(goal==="bulk"){
      targetKcal=Math.round(tdee+350);
      targetProtein=Math.round((units==="kg"?wKg*2.2:weight)*0.85);
    }

    const fatKcal=targetKcal*0.25;
    const targetFat=Math.round(fatKcal/9);
    const carbKcal=Math.max(0, targetKcal - (targetProtein*4 + targetFat*9));
    const targetCarbs=Math.round(carbKcal/4);

    onSave({
      kcal:targetKcal,
      protein:targetProtein,
      carbs:targetCarbs,
      fat:targetFat,
      goal,
      calculated:true
    });
  };

  return <div onClick={onClose} className="modal-bg" style={{position:"fixed",inset:0,zIndex:70,background:"rgba(0,0,0,.9)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} className="slide-up card" style={{width:"100%",maxWidth:360,padding:16,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,borderBottom:"1px solid #18181b",paddingBottom:10}}>
        <div>
          <div style={{fontSize:9,letterSpacing:"0.18em",fontWeight:900,color:"#4ade80"}}>USDA / TDEE ENGINE</div>
          <div style={{fontSize:15,fontWeight:900}}>MACRO CALCULATOR</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#52525b",cursor:"pointer"}}><Icon name="X" size={17}/></button>
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div>
            <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:4}}>GENDER</div>
            <select value={gender} onChange={e=>setGender(e.target.value)} style={I}>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
          <div>
            <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:4}}>AGE</div>
            <input type="number" value={age} onChange={e=>setAge(Number(e.target.value))} style={I}/>
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div>
            <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:4}}>WEIGHT ({units.toUpperCase()})</div>
            <input type="number" value={weight} onChange={e=>setWeight(Number(e.target.value))} style={I}/>
          </div>
          <div>
            <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:4}}>HEIGHT ({units==="kg"?"CM":"IN"})</div>
            <input type="number" value={height} onChange={e=>setHeight(Number(e.target.value))} style={I}/>
          </div>
        </div>

        <div>
          <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:4}}>ACTIVITY LEVEL</div>
          <select value={activity} onChange={e=>setActivity(Number(e.target.value))} style={I}>
            <option value={1.2}>Sedentary (Desk job / minimal exercise)</option>
            <option value={1.375}>Lightly Active (1-2 workouts / week)</option>
            <option value={1.55}>Moderately Active (3-5 workouts / week)</option>
            <option value={1.725}>Very Active (6-7 heavy sessions / week)</option>
          </select>
        </div>

        <div>
          <div style={{fontSize:8,color:"#71717a",fontWeight:700,marginBottom:6}}>PRIMARY GOAL</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
            {[["cut","🔥 CUT","Fat loss (-500)"],["maintain","⚖️ MAINTAIN","Stay lean"],["bulk","💪 BULK","Muscle (+350)"]].map(([k,l,sub])=><button key={k} onClick={()=>setGoal(k)} className="tap" style={{padding:"8px 4px",border:goal===k?"1px solid #4ade80":"1px solid #27272a",background:goal===k?"rgba(74,222,128,.1)":"#000",color:goal===k?"#4ade80":"#71717a",borderRadius:7,cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:9,fontWeight:900}}>{l}</div>
              <div style={{fontSize:7,marginTop:2,opacity:0.8}}>{sub}</div>
            </button>)}
          </div>
        </div>

        <button onClick={calculate} className="tap" style={{width:"100%",padding:13,background:"#fff",color:"#000",border:"none",borderRadius:9,fontSize:10,letterSpacing:"0.14em",fontWeight:900,cursor:"pointer",marginTop:6}}>
          CALCULATE & SET TARGETS ✓
        </button>
      </div>
    </div>
  </div>;
}

/* ── AI MEAL SOLVER MODAL ── */
function AiMealSolverModal({remKcal,remP,tone,onLogMeal,onClose}){
  const[loading,setLoading]=useState(false);
  const[meals,setMeals]=useState([]);

  const solve=async()=>{
    setLoading(true);
    try{
      const prompt=`You are a clinical nutritionist with USDA accuracy.
User has ${remKcal} kcal and ${remP}g protein left in their daily calorie budget.
Coaching tone: ${tone}.
Suggest 3 specific, fast, delicious meals/snacks matching this remaining macro deficit closely.
Reply ONLY with a raw JSON array matching this structure:
[
  {"food":"Name","serving":"Specific serving description e.g. 150g grilled chicken + 1 cup rice","kcal":number,"protein":number,"carbs":number,"fat":number,"desc":"Why this fits"}
]`;
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:400,temperature:0.25}})
      });
      const d=await res.json();
      const raw=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      const m=raw.match(/\[[\s\S]*\]/);
      if(m){
        const parsed=JSON.parse(m[0]);
        if(Array.isArray(parsed)&&parsed.length>0){
          setMeals(parsed);
          setLoading(false);
          return;
        }
      }
    }catch(e){console.warn("Meal solver error:",e);}
    setMeals([
      {food:"Greek Yogurt Power Bowl",serving:"1 cup nonfat yogurt + 1 scoop whey + berries",kcal:Math.min(remKcal,280),protein:Math.min(remP,38),carbs:22,fat:2,desc:"High-protein, zero prep"},
      {food:"Egg Whites & Avocado Toast",serving:"4 egg whites, 1 whole egg, 1 slice sourdough",kcal:Math.min(remKcal,320),protein:Math.min(remP,28),carbs:25,fat:11,desc:"Clean micronutrient dense meal"},
      {food:"Chicken Breast & Sweet Potato",serving:"150g cooked chicken breast + 150g baked potato",kcal:Math.min(remKcal,380),protein:Math.min(remP,46),carbs:38,fat:5,desc:"Gold standard muscle building fuel"}
    ]);
    setLoading(false);
  };

  useEffect(()=>{solve();},[]);

  return <div onClick={onClose} className="modal-bg" style={{position:"fixed",inset:0,zIndex:70,background:"rgba(0,0,0,.9)",display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} className="slide-up card" style={{width:"100%",maxWidth:380,padding:16,maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,borderBottom:"1px solid #18181b",paddingBottom:10}}>
        <div>
          <div style={{fontSize:8,letterSpacing:"0.18em",fontWeight:900,color:"#60a5fa"}}>AI NUTRITIONIST</div>
          <div style={{fontSize:15,fontWeight:900}}>WHAT SHOULD I EAT?</div>
        </div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#52525b",cursor:"pointer"}}><Icon name="X" size={17}/></button>
      </div>

      <div style={{padding:"8px 10px",background:"rgba(96,165,250,.08)",border:"1px solid rgba(96,165,250,.25)",borderRadius:8,marginBottom:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <span style={{fontSize:9,color:"#93c5fd",fontWeight:700}}>REMAINING TODAY:</span>
        <span style={{fontSize:11,fontWeight:900,color:"#fff"}}>{remKcal} kcal · <span style={{color:"#60a5fa"}}>{remP}g Protein</span></span>
      </div>

      {loading?<div style={{textAlign:"center",padding:"30px 0"}}>
        <span className="shimmer" style={{fontSize:11,fontWeight:900,letterSpacing:"0.14em"}}>AI CALCULATING OPTIMAL MEALS...</span>
      </div>:<div style={{display:"flex",flexDirection:"column",gap:9}}>
        {meals.map((m,idx)=><div key={idx} className="card fade-up" style={{padding:12,background:"#000",border:"1px solid #27272a"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:4}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:900,color:"#fff"}}>{m.food}</div>
              <div style={{fontSize:9,color:"#71717a",marginTop:1}}>{m.serving}</div>
            </div>
            <div style={{textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:13,fontWeight:900,color:"#fff"}}>{m.kcal} kcal</div>
              <div style={{fontSize:9,fontWeight:900,color:"#60a5fa"}}>{m.protein}g PROT</div>
            </div>
          </div>
          {m.desc&&<div style={{fontSize:9,color:"#52525b",marginBottom:8,lineHeight:1.4}}>{m.desc}</div>}
          <button onClick={()=>{onLogMeal(m);onClose();}} className="tap" style={{width:"100%",padding:"7px 0",background:"#fff",color:"#000",border:"none",borderRadius:6,fontSize:8,letterSpacing:"0.12em",fontWeight:900,cursor:"pointer"}}>
            + LOG THIS MEAL
          </button>
        </div>)}
      </div>}
    </div>
  </div>;
}

/* ── DAILY NUTRITION SUMMARY ── */
function DailyNutritionSummary({mHistory,macroGoals,onOpenCalc,onOpenSolver}){
  const todayMeals=mHistory.filter(m=>m.date===todayStr());
  const totalKcal=todayMeals.reduce((acc,m)=>acc+(m.kcal||0),0);
  const totalP=Math.round(todayMeals.reduce((acc,m)=>acc+(m.protein||0),0));
  const totalC=Math.round(todayMeals.reduce((acc,m)=>acc+(m.carbs||0),0));
  const totalF=Math.round(todayMeals.reduce((acc,m)=>acc+(m.fat||0),0));

  const targetKcal=macroGoals?.kcal||2200;
  const targetP=macroGoals?.protein||150;
  const targetC=macroGoals?.carbs||220;
  const targetF=macroGoals?.fat||65;

  const remKcal=Math.max(0, targetKcal - totalKcal);
  const remP=Math.max(0, targetP - totalP);

  const kcalPct=Math.min(Math.round((totalKcal/targetKcal)*100),100);
  const pPct=Math.min(Math.round((totalP/targetP)*100),100);

  return <div className="card fade-up" style={{padding:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <div>
        <div style={{fontSize:9,fontWeight:900,letterSpacing:"0.14em",color:"#d4d4d8"}}>TODAY'S MACROS (USDA)</div>
        <div style={{fontSize:8,color:"#52525b",fontWeight:700}}>{todayMeals.length} logged · {remKcal} kcal remaining</div>
      </div>
      <div style={{display:"flex",gap:5}}>
        <button onClick={onOpenCalc} className="tap" style={{padding:"4px 7px",background:"#18181b",border:"1px solid #27272a",borderRadius:5,fontSize:8,fontWeight:900,color:"#a1a1aa",cursor:"pointer"}}>
          🎯 TARGETS
        </button>
        <button onClick={onOpenSolver} className="tap" style={{padding:"4px 7px",background:"rgba(96,165,250,.15)",border:"1px solid rgba(96,165,250,.35)",borderRadius:5,fontSize:8,fontWeight:900,color:"#60a5fa",cursor:"pointer"}}>
          ✨ WHAT TO EAT
        </button>
      </div>
    </div>

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <div>
        <div style={{fontSize:22,fontWeight:900,color:"#fff"}}>{totalKcal.toLocaleString()} <span style={{fontSize:11,color:"#71717a",fontWeight:600}}>/ {targetKcal} kcal</span></div>
        <div style={{fontSize:8,color:totalKcal<=targetKcal?"#4ade80":"#f87171",fontWeight:700}}>{totalKcal<=targetKcal?`${remKcal} kcal left`:`+${totalKcal-targetKcal} over limit`}</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:16,fontWeight:900,color:"#60a5fa"}}>{totalP}g <span style={{fontSize:10,color:"#71717a",fontWeight:600}}>/ {targetP}g</span></div>
        <div style={{fontSize:8,color:"#60a5fa",fontWeight:700}}>PROTEIN ({pPct}%)</div>
      </div>
    </div>

    <div style={{marginBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:"#52525b",fontWeight:700,marginBottom:3}}>
        <span>CALORIES</span><span>{kcalPct}%</span>
      </div>
      <div style={{height:4,background:"#18181b",borderRadius:99,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${kcalPct}%`,background:"linear-gradient(90deg,#4ade80,#fbbf24)",borderRadius:99,transition:"width .4s"}}/>
      </div>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,background:"#000",padding:"6px 8px",borderRadius:8,border:"1px solid #18181b"}}>
      <div style={{textAlign:"center"}}><div style={{fontSize:7,color:"#60a5fa",fontWeight:700}}>PROTEIN</div><div style={{fontSize:12,fontWeight:900}}>{totalP} / {targetP}g</div></div>
      <div style={{textAlign:"center"}}><div style={{fontSize:7,color:"#4ade80",fontWeight:700}}>CARBS</div><div style={{fontSize:12,fontWeight:900}}>{totalC} / {targetC}g</div></div>
      <div style={{textAlign:"center"}}><div style={{fontSize:7,color:"#fb923c",fontWeight:700}}>FAT</div><div style={{fontSize:12,fontWeight:900}}>{totalF} / {targetF}g</div></div>
    </div>
  </div>;
}

/* ── WATER TRACKER ── */
function WaterTracker(){
  const[water,setWater]=useState(()=>{const d=loadJSON("fg_water",{date:null,count:0});return d.date===todayStr()?d:{date:todayStr(),count:0};});
  useEffect(()=>{saveJSON("fg_water",water);},[water]);
  const add=()=>setWater(w=>({...w,count:Math.min(w.count+1,12)}));
  const sub=()=>setWater(w=>({...w,count:Math.max(w.count-1,0)}));
  const goal=8;
  const pct=Math.min((water.count/goal)*100,100);
  return <div className="card" style={{padding:"11px 13px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <Icon name="Droplets" size={16} sw={1.5} style={{color:"#38bdf8"}}/>
        <div style={{fontSize:10,fontWeight:900,letterSpacing:"0.1em"}}>WATER</div>
      </div>
      <div style={{fontSize:10,color:water.count>=goal?"#4ade80":"#71717a",fontWeight:700}}>{water.count}/{goal} glasses</div>
    </div>
    <div style={{display:"flex",gap:5,alignItems:"center"}}>
      <button onClick={sub} className="tap" style={{width:28,height:28,border:"1px solid #27272a",background:"none",color:"#52525b",cursor:"pointer",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900}}>−</button>
      <div style={{flex:1,display:"flex",gap:3}}>
        {Array.from({length:goal}).map((_,i)=><div key={i} style={{flex:1,height:24,borderRadius:4,background:i<water.count?"rgba(56,189,248,.7)":"#18181b",border:i<water.count?"1px solid rgba(56,189,248,.5)":"1px solid #27272a",transition:"all .2s"}}/>)}
      </div>
      <button onClick={add} className="tap" style={{width:28,height:28,border:"1px solid #38bdf8",background:"rgba(56,189,248,.1)",color:"#38bdf8",cursor:"pointer",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900}}>+</button>
    </div>
    {water.count>=goal&&<div style={{textAlign:"center",fontSize:8,color:"#4ade80",fontWeight:700,marginTop:5,letterSpacing:"0.12em"}}>✓ HYDRATION GOAL MET</div>}
  </div>;
}

/* ══ FOOD TAB ══ */
function FoodTab({tone,addXP,mHistory,recordMeal,deleteMeal,setShowPaywall,macroGoals,setMacroGoals,units}){
  const[text,setText]=useState("");
  const[loading,setLoading]=useState(false);
  const[imgPrev,setImgPrev]=useState(null);
  const[imgB64,setImgB64]=useState(null);
  const[scanning,setScanning]=useState(false);
  const[scanResult,setScanResult]=useState(null);
  const[portion,setPortion]=useState(1);
  const[showCamOpts,setShowCamOpts]=useState(false);
  const[correcting,setCorrecting]=useState(false);
  const[showCalc,setShowCalc]=useState(false);
  const[showSolver,setShowSolver]=useState(false);
  const camRef=useRef(null);
  const galRef=useRef(null);

  const getMealCategory=()=>{
    const h=new Date().getHours();
    if(h<11)return "Breakfast";
    if(h<16)return "Lunch";
    if(h<21)return "Dinner";
    return "Snack";
  };

  const geminiScan=async(b64)=>{
    try{
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {text:'You are a clinical nutrition expert with USDA FoodData Central accuracy. Analyze this food image. Identify the food and estimate total nutritional info using exact grams/ounces. Use realistic portion sizes. Reply ONLY with valid JSON, no markdown: {"food":"name","serving":"estimated weight in grams e.g. 180g","kcal":number,"protein":number,"carbs":number,"fat":number,"confidence":0.85}'},
          {inline_data:{mime_type:"image/jpeg",data:b64}}
        ]}]})
      });
      const d=await res.json();
      const txt=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      const m=txt.match(/\{[\s\S]*\}/);
      if(m){const p=JSON.parse(m[0]);if(p.food&&p.kcal) return p;}
    }catch(e){console.log("Scan error:",e);}
    return null;
  };

  const handleFile=async(file)=>{
    if(!file)return;
    const r=new FileReader();
    r.onload=async e=>{
      const compressed=await compressImg(e.target.result);
      setImgPrev(compressed);
      const b64=compressed.split(",")[1];
      setImgB64(b64);
      setScanResult(null);setPortion(1);
      setScanning(true);
      const result=await geminiScan(b64);
      if(result){setScanResult(result);}
      else{setScanResult({food:"Meal",serving:"1 serving (200g)",kcal:400,protein:22,carbs:42,fat:14,confidence:0.5});}
      setScanning(false);
    };
    r.readAsDataURL(file);
  };

  const logText=async()=>{
    if(!text.trim())return;
    setLoading(true);
    const ts=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    const mk=(food,kcal,protein,carbs,fat,serving)=>({
      id:Date.now(),
      date:todayStr(),
      food:text,
      displayName:food,
      kcal,
      protein,
      carbs,
      fat,
      servingInfo:serving||"estimated",
      photo:false,
      photoSrc:null,
      category:getMealCategory(),
      time:ts
    });

    try{
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:'You are a clinical registered dietitian and USDA FoodData Central reference expert. Calculate TOTAL calories and macros for this exact food: "'+text+'". Ground your calculations in USDA standard reference values. Respect exact quantities and weights (grams/oz). Reply ONLY with raw JSON, no markdown: {"food":"Clean Food Name","serving":"Specific serving description with estimated grams e.g. 150g","kcal":number,"protein":number,"carbs":number,"fat":number}'}]}],generationConfig:{maxOutputTokens:120,temperature:0.15}})
      });
      const d=await res.json();
      const txt2=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      const m=txt2.match(/\{[\s\S]*\}/);
      if(m){const p=JSON.parse(m[0]);if(p.food&&p.kcal){
        recordMeal(mk(p.food,Math.round(p.kcal),Math.round(p.protein),Math.round(p.carbs),Math.round(p.fat),p.serving));
        addXP(5,"Meal Logged");setText("");setLoading(false);return;
      }}
    }catch(e){}
    const mac=getFoodMacros(text);
    recordMeal(mk(mac.food,mac.kcal,Math.round(mac.p),Math.round(mac.c),Math.round(mac.fat),mac.serving));
    addXP(5,"Meal Logged");setText("");setLoading(false);
  };

  const saveScan=()=>{
    if(!scanResult)return;
    const m=portion;
    const entry={
      id:Date.now(),
      date:todayStr(),
      food:scanResult.food,
      kcal:Math.round(scanResult.kcal*m),
      protein:Math.round((scanResult.protein||0)*m),
      carbs:Math.round((scanResult.carbs||0)*m),
      fat:Math.round((scanResult.fat||0)*m),
      photo:true,
      photoSrc:imgPrev,
      serving:scanResult.serving,
      portion:m,
      category:getMealCategory(),
      time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})
    };
    recordMeal(entry);addXP(15,"Photo Scan");
    setImgPrev(null);setImgB64(null);setScanResult(null);setPortion(1);
  };

  const correctScan=async(newFood)=>{
    setCorrecting(false);setScanning(true);
    try{
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+GEMINI_KEY,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{role:"user",parts:[{text:'The food is: '+newFood+'. Give accurate USDA nutrition for a standard serving. Reply ONLY with JSON: {"food":"name","serving":"description (weight)","kcal":number,"protein":number,"carbs":number,"fat":number,"confidence":1}'}]}],generationConfig:{maxOutputTokens:150,temperature:0.2}})
      });
      const d=await res.json();
      const txt=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      const m=txt.match(/\{[\s\S]*\}/);
      if(m){const p=JSON.parse(m[0]);if(p.food){setScanResult({...p,corrected:true});setScanning(false);return;}}
    }catch(e){}
    const mac=getFoodMacros(newFood);
    setScanResult({food:newFood,kcal:mac.kcal,protein:Math.round(mac.p),carbs:Math.round(mac.c),fat:Math.round(mac.fat),confidence:1,corrected:true});
    setScanning(false);
  };

          {scanning&&<><div className="scan-bar" style={{top:0}}/><div style={{position:"absolute",inset:0,background:"rgba(0,255,160,.05)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6}}>
            <Icon name="Scan" size={32} style={{color:"rgba(0,255,180,.85)",animation:"spin 1s linear infinite"}}/>

          <button onClick={()=>{setImgPrev(null);setImgB64(null);setScanResult(null);}} style={{position:"absolute",top:7,right:7,background:"rgba(0,0,0,.65)",border:"none",borderRadius:99,width:24,height:24,color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="X" size={12}/></button>
        </div>:<div onClick={()=>setShowCamOpts(true)} className="tap" style={{width:"100%",height:110,border:"2px dashed #27272a",borderRadius:10,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,cursor:"pointer"}}>
          <Icon name="Camera" size={28} style={{color:"#3f3f46"}}/><div style={{fontSize:9,letterSpacing:"0.1em",color:"#52525b",fontWeight:700}}>TAP TO SCAN FOOD</div>
        </div>}
        <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{handleFile(e.target.files[0]);e.target.value="";}}/>
        <input ref={galRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{handleFile(e.target.files[0]);e.target.value="";}}/>
        {scanResult&&<div className="fade-up" style={{background:"#000",borderRadius:10,padding:12,border:"1px solid #27272a"}}>

            <div style={{fontSize:9,color:"#4ade80",fontWeight:700,textAlign:"right"}}><div>{Math.round((scanResult.confidence||0.8)*100)}%</div>{scanResult.corrected&&<div style={{color:"#fbbf24"}}>CORRECTED</div>}</div>
          </div>
          <div style={{marginBottom:10}}><div style={{fontSize:8,color:"#52525b",fontWeight:700,letterSpacing:"0.12em",marginBottom:6}}>PORTION SIZE</div>
            <div style={{display:"flex",gap:5}}>
              {[0.5,0.75,1,1.5,2].map(p=><button key={p} onClick={()=>setPortion(p)} className="tap" style={{padding:"5px 9px",fontSize:9,fontWeight:900,border:portion===p?"1px solid #fff":"1px solid #27272a",background:portion===p?"#fff":"transparent",color:portion===p?"#000":"#52525b",borderRadius:99,cursor:"pointer"}}>{p===1?"1×":`${p}×`}</button>)}
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
            {[["KCAL",Math.round(scanResult.kcal*portion),""],["PROT",Math.round((scanResult.protein||0)*portion),"g"],["CARBS",Math.round((scanResult.carbs||0)*portion),"g"],["FAT",Math.round((scanResult.fat||0)*portion),"g"]].map(([l,v,u])=><div key={l} style={{textAlign:"center",background:"#09090b",padding:"6px 4px",borderRadius:7}}>

      <div style={{display:"flex",gap:7}}>

        <button onClick={logText} disabled={loading||!text.trim()} className="tap" style={{padding:"0 16px",background:(!loading&&text.trim())?"#fff":"#18181b",color:(!loading&&text.trim())?"#000":"#52525b",border:"none",fontSize:9,letterSpacing:"0.12em",fontWeight:900,cursor:loading?"default":"pointer",borderRadius:10}}>{loading?"···":"LOG"}</button>
      </div>
      {/* Quick Food Chips */}
      <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2}}>
        {[
          "2 eggs and toast",
          "150g chicken breast & 1 cup rice",

    {/* Camera sheet */}
    {showCamOpts&&<div onClick={()=>setShowCamOpts(false)} className="modal-bg" style={{position:"fixed",inset:0,zIndex:60,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
      <div onClick={e=>e.stopPropagation()} className="slide-up" style={{width:"100%",maxWidth:480,background:"#09090b",border:"1px solid #27272a",borderRadius:"14px 14px 0 0",padding:16,paddingBottom:32}}>
        <div style={{fontSize:9,letterSpacing:"0.18em",color:"#52525b",fontWeight:700,textAlign:"center",marginBottom:14}}>CAPTURE METHOD</div>
        {[["Camera","TAKE LIVE PHOTO",()=>{camRef.current?.click();setShowCamOpts(false);}],["Upload","CHOOSE FROM GALLERY",()=>{galRef.current?.click();setShowCamOpts(false);}]].map(([ic,l,fn])=><button key={l} onClick={fn} className="tap" style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"14px 16px",background:"none",border:"1px solid #27272a",borderRadius:10,color:"#fff",cursor:"pointer",marginBottom:9,textAlign:"left"}}>
          <Icon name={ic} size={20} sw={1.5} style={{color:"#71717a"}}/><div style={{fontSize:11,fontWeight:900,letterSpacing:"0.1em"}}>{l}</div>
        </button>)}
      </div>
    </div>}

    {correcting&&<CorrectionModal onSave={correctScan} onClose={()=>setCorrecting(false)}/>}
    {showCalc&&<MacroCalculatorModal units={units} currentGoals={macroGoals} onSave={g=>{setMacroGoals(g);setShowCalc(false);playSound("complete");}} onClose={()=>setShowCalc(false)}/>}
    {showSolver&&<AiMealSolverModal remKcal={Math.max(0,(macroGoals?.kcal||2200)-mHistory.filter(m=>m.date===todayStr()).reduce((a,b)=>a+(b.kcal||0),0))} remP={Math.max(0,(macroGoals?.protein||150)-Math.round(mHistory.filter(m=>m.date===todayStr()).reduce((a,b)=>a+(b.protein||0),0)))} tone={tone} onLogMeal={m=>{recordMeal({id:Date.now(),date:todayStr(),food:m.food,displayName:m.food,kcal:m.kcal,protein:m.protein,carbs:m.carbs,fat:m.fat,servingInfo:m.serving,photo:false,photoSrc:null,category:getMealCategory(),time:new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})});addXP(10,"AI Meal Logged");}} onClose={()=>setShowSolver(false)}/>}
  </div>;
}

/* ══ RANK TAB ══ */
function RankTab({xp,tone,wCount,mCount,streak,flags,chalData,setChalData,addXP,setFlag,onBadge}){
  const{lv,nx,pct,idx}=getLvl(xp);
  const R=46,C=2*Math.PI*R;
  const completeChallenge=ch=>{
    const today=todayStr();
    const ex=chalData[ch.id]||{lastDone:null,streak:0,total:0};
    if(ex.lastDone===today)return;
    const yest=daysAgo(1);
    const ns=ex.lastDone===yest?ex.streak+1:1;
    setChalData(p=>({...p,[ch.id]:{lastDone:today,streak:ns,total:ex.total+1}}));
    addXP(ch.xp,ch.n);
    if(DAILY_CHALLENGES.every(c=>c.id===ch.id||chalData[c.id]?.lastDone===today))setFlag("allChallenges");
  };
  const isDone=id=>chalData[id]?.lastDone===todayStr();
  return <div style={{padding:14,paddingBottom:28,display:"flex",flexDirection:"column",gap:14}}>
    <div className="card" style={{padding:18,position:"relative",overflow:"hidden",background:`linear-gradient(135deg,#09090b,${lv.c}12)`,border:`1px solid ${lv.c}44`}}>
      <div style={{display:"flex",alignItems:"center",gap:14}}>
        <div style={{position:"relative",width:100,height:100,flexShrink:0}}>
          <svg width="100" height="100" style={{transform:"rotate(-90deg)"}}><circle cx="50" cy="50" r={R} fill="none" stroke="rgba(255,255,255,.07)" strokeWidth="7"/><circle cx="50" cy="50" r={R} fill="none" stroke={lv.c} strokeWidth="7" strokeDasharray={C} strokeDashoffset={C-(pct/100)*C} strokeLinecap="round" style={{transition:"stroke-dashoffset 1.2s",filter:`drop-shadow(0 0 6px ${lv.c})`}}/></svg>
          <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><div style={{fontSize:8,color:"#71717a",fontWeight:700}}>LVL</div><div style={{fontSize:28,fontWeight:900,lineHeight:1,color:lv.c}}>{idx+1}</div></div>
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:8,letterSpacing:"0.2em",color:"#71717a",fontWeight:700}}>CURRENT RANK</div>
          <div style={{fontSize:26,fontWeight:900,color:lv.c,textShadow:`0 0 20px ${lv.c}66`,marginBottom:2}}>{lv.n}</div>
          <div style={{fontSize:10,color:"#71717a",fontWeight:700}}>{xp.toLocaleString()} XP · {streak}d 🔥</div>
          {nx&&<div style={{fontSize:9,color:"#3f3f46",marginTop:2}}>{(nx.xp-xp).toLocaleString()} XP → {nx.n}</div>}
        </div>
      </div>
      <div style={{marginTop:12,height:3,background:"rgba(255,255,255,.07)",borderRadius:99,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:lv.c,borderRadius:99,transition:"width 1.2s",boxShadow:`0 0 8px ${lv.c}`}}/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7}}>
      {[[xp.toLocaleString(),"XP",lv.c],[streak+"d","STREAK","#f87171"],[wCount.toString(),"SESSIONS","#60a5fa"]].map(([v,l,c])=><div key={l} className="card" style={{padding:"11px 7px",textAlign:"center",border:`1px solid ${c}22`,background:`${c}08`}}>
        <div style={{fontSize:19,fontWeight:900,color:c}}>{v}</div>
        <div style={{fontSize:7,letterSpacing:"0.12em",color:"#52525b",fontWeight:700,marginTop:2}}>{l}</div>
      </div>)}
    </div>
    {/* Daily Challenges */}
    <div>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><div style={{fontSize:10,fontWeight:900,letterSpacing:"0.12em"}}>DAILY CHALLENGES</div><div style={{fontSize:8,color:"#52525b",fontWeight:700}}>{DAILY_CHALLENGES.filter(c=>isDone(c.id)).length}/{DAILY_CHALLENGES.length}</div></div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {DAILY_CHALLENGES.map(ch=>{const done=isDone(ch.id);const d=chalData[ch.id]||{};return <div key={ch.id} style={{display:"flex",alignItems:"center",gap:11,padding:"11px 12px",border:done?"1px solid rgba(74,222,128,.3)":"1px solid #27272a",borderRadius:10,background:done?"rgba(74,222,128,.05)":"#09090b"}}>
          <button onClick={()=>!done&&completeChallenge(ch)} disabled={done} className={done?"":"tap"} style={{width:34,height:34,borderRadius:8,background:done?"rgba(74,222,128,.15)":"#18181b",border:done?"1px solid rgba(74,222,128,.4)":"1px solid #27272a",display:"flex",alignItems:"center",justifyContent:"center",color:done?"#4ade80":"#52525b",cursor:done?"default":"pointer",flexShrink:0}}><Icon name={done?"Check":ch.icon} size={15} sw={done?2.5:1.5}/></button>
          <div style={{flex:1}}><div style={{fontSize:11,fontWeight:900,color:done?"#52525b":"#d4d4d8",textDecoration:done?"line-through":"none"}}>{ch.n}</div><div style={{fontSize:9,color:"#52525b",marginTop:1}}>{ch.desc}</div>{d.streak>1&&<div style={{fontSize:8,color:"#fbbf24",marginTop:2,fontWeight:700}}>{d.streak}🔥 streak · {d.total} total</div>}</div>
          <div style={{fontSize:10,fontWeight:900,color:done?"#4ade80":"#fbbf24",flexShrink:0}}>{done?"✓":"+"+ch.xp}</div>
        </div>;})}
      </div>
    </div>
    {/* Badge Paths */}
    {BADGE_PATHS.map(path=><BadgePath key={path.id} path={path} xp={xp} wCount={wCount} mCount={mCount} streak={streak} flags={flags} onBadge={onBadge}/>)}
  </div>;
}

function BadgePath({path,xp,wCount,mCount,streak,flags,onBadge}){
  const unlocked=path.badges.filter(b=>isBadgeUnlocked(b,path.id,xp,wCount,mCount,streak,flags)).length;
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:9}}><div><div style={{fontSize:10,fontWeight:900,letterSpacing:"0.12em",color:"#d4d4d8"}}>{path.title}</div><div style={{fontSize:9,color:"#52525b"}}>{path.sub}</div></div><div style={{fontSize:8,color:path.acc,fontWeight:700}}>{unlocked}/{path.badges.length}</div></div>
    <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:6}}>
      {path.badges.map(b=>{const isU=isBadgeUnlocked(b,path.id,xp,wCount,mCount,streak,flags);const pc=badgePct(b,path.id,xp,wCount,mCount,streak,flags);const ip=!isU&&pc>8;return <div key={b.id} onClick={()=>onBadge(b,path.id)} className="tap" style={{flexShrink:0,width:80,display:"flex",flexDirection:"column",alignItems:"center",cursor:"pointer"}}>
        <div className={isU?b.gl:""} style={{width:76,height:76,borderRadius:14,background:isU?b.g:"rgba(255,255,255,.025)",border:isU?`1px solid ${b.c}55`:ip?"1px solid #2a2a2a":"1px solid #1a1a1a",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
          {isU&&<div style={{position:"absolute",inset:0,background:"linear-gradient(135deg,rgba(255,255,255,.14) 0%,transparent 50%)"}}/>}
          <Icon name={b.icon} size={20} sw={isU?2.2:1.2} style={{color:isU?b.c:ip?"#3f3f46":"#1f1f1f",filter:isU?`drop-shadow(0 0 5px ${b.c})`:"none"}}/>
          <div style={{fontSize:7,fontWeight:900,textAlign:"center",padding:"3px 4px 0",color:isU?"#fff":ip?"#3f3f46":"#1f1f1f",lineHeight:1.2}}>{b.n}</div>
        </div>
        <div style={{textAlign:"center",marginTop:3}}>{isU?<div style={{fontSize:7,color:"#4ade80",fontWeight:700}}>EARNED</div>:ip?<div style={{fontSize:7,color:b.c,fontWeight:700}}>{Math.floor(pc)}%</div>:<div style={{fontSize:7,color:"#1f1f1f"}}>LOCKED</div>}</div>
      </div>;})}
    </div>
  </div>;
}

function BadgeModal({b,pid,xp,wCount,mCount,streak,flags,onClose}){
  const isU=isBadgeUnlocked(b,pid,xp,wCount,mCount,streak,flags);
  const pc=badgePct(b,pid,xp,wCount,mCount,streak,flags);

/* ══ MOBILE APP INSTALL CARD ══ */
function InstallAppCard(){
  const[canInstall,setCanInstall]=useState(Boolean(window.deferredPrompt));
  const[isInstalled,setIsInstalled]=useState(()=>{
    return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
  });
  const[showGuide,setShowGuide]=useState(false);

  useEffect(()=>{
    const handler=()=>setCanInstall(true);
    window.addEventListener("pwa-installable",handler);
    window.addEventListener("appinstalled",()=>{setIsInstalled(true);setCanInstall(false);});
    if(window.deferredPrompt) setCanInstall(true);
    return ()=>{
      window.removeEventListener("pwa-installable",handler);
    };
  },[]);

  const handleInstall=async()=>{
    if(window.deferredPrompt){
      window.deferredPrompt.prompt();
      const choice=await window.deferredPrompt.userChoice;
      if(choice&&choice.outcome==="accepted"){
        setIsInstalled(true);
      }
      window.deferredPrompt=null;
      setCanInstall(false);
    }else{
      setShowGuide(p=>!p);
    }
  };

  if(isInstalled){
    return <div className="card" style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:11,background:"rgba(74,222,128,.06)",border:"1px solid rgba(74,222,128,.3)"}}>
      <div style={{width:38,height:38,borderRadius:10,background:"rgba(74,222,128,.15)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#4ade80"}}>
        <Icon name="Check" size={18} sw={2.5}/>
      </div>
      <div>
        <div style={{fontSize:11,fontWeight:900,color:"#4ade80"}}>INSTALLED ON DEVICE</div>
        <div style={{fontSize:9,color:"#71717a",marginTop:1}}>Running in standalone hardware-accelerated mode</div>
      </div>
    </div>;
  }

  return <div className="card" style={{padding:12,border:"1px solid #3f3f46",background:"#0d1117"}}>
    <div style={{display:"flex",alignItems:"center",gap:12}}>
      <img src="icon-192.png" alt="App Icon" style={{width:40,height:40,borderRadius:10,border:"1px solid #27272a",background:"#000",flexShrink:0}}/>
      <div style={{flex:1}}>
        <div style={{fontSize:11,fontWeight:900,color:"#fff"}}>INSTALL FITGENIUS ON ANDROID</div>
        <div style={{fontSize:9,color:"#8b949e",marginTop:2}}>Full screen, App Drawer, offline speed</div>
      </div>
      <button onClick={handleInstall} className="tap" style={{padding:"8px 13px",background:"#22c55e",color:"#000",border:"none",borderRadius:8,fontSize:10,fontWeight:900,cursor:"pointer",display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
        <Icon name="Download" size={13} sw={2.5}/> INSTALL
      </button>
    </div>
    {showGuide&&<div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #27272a",fontSize:10,color:"#a1a1aa",lineHeight:1.6}}>
      <div style={{fontWeight:800,color:"#fff",marginBottom:3}}>Android 1-Tap Install Instructions:</div>
      <div>1. Tap Chrome's <b style={{color:"#fff"}}>three vertical dots (⋮)</b> in the top right corner.</div>
      <div>2. Select <b style={{color:"#4ade80"}}>"Install app"</b> or <b style={{color:"#4ade80"}}>"Add to Home screen"</b>.</div>
      <div>3. Android creates FitGenius directly in your App Drawer & Home screen!</div>
    </div>}
  </div>;
}

    const clean=val.replace(/\D/g,"").slice(0,16);
    let brand="generic";
    if(/^4/.test(clean)) brand="visa";
    else if(/^5[1-5]/.test(clean)) brand="mastercard";
    else if(/^3[47]/.test(clean)) brand="amex";
    else if(/^6/.test(clean)) brand="discover";
    setCardBrand(brand);
    const groups=clean.match(/.{1,4}/g);
    setCardNum(groups?groups.join(" "):"");
  };

  const formatExp=(val)=>{
    const clean=val.replace(/\D/g,"").slice(0,4);
    if(clean.length>=3){

            </div>

          <button onClick={()=>triggerPayment("card")} className="tap" style={{width:"100%",padding:14,background:"linear-gradient(135deg,#78350f,#d97706)",color:"#fff",border:"none",borderRadius:10,fontSize:11,letterSpacing:"0.12em",fontWeight:900,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
            <Icon name="Lock" size={14} sw={2}/> {plan==="year"?"START 7-DAY FREE TRIAL":"PAY $9.99 / MONTH"}
          </button>

          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:9,color:"#52525b"}}>
            <Icon name="Lock" size={10}/>
            <span>Powered by Stripe · 256-bit bank encryption · Cancel anytime</span>
          </div>
        </>}
      </div>
    </div>
  </div>;
}

/* ══ COACH POPUP ══ */
function CoachPopup({msg,tone,onClose}){
  const MSGS={
    brutal:{levelUp:"New rank. Prove you belong.",workout:"Done. Same time tomorrow.",greeting:"Weakness is a choice."},
    friendly:{levelUp:"You leveled up! Keep going! 🎉",workout:"Amazing workout! 💪",greeting:"You're doing great!"},

  };

  const c={brutal:"#fff",friendly:"#4ade80",hype:"#fbbf24"}[tone]||"#fff";
  useEffect(()=>{const t=setTimeout(onClose,4500);return()=>clearTimeout(t);},[]);
